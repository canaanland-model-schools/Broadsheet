<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Canaanland Model Schools</title>

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100vh; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #0d1b2a;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;

    /* Background image behind everything */
    background-color: #e8f4fb;
    background-image: url('img/background-logo.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Soft overlay so the background image doesn't overpower content
     Uses a blue → fuchsia → aqua tint */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg,
                rgba(0, 90, 200, 0.82) 0%,
                rgba(200, 0, 170, 0.78) 55%,
                rgba(0, 220, 220, 0.80) 100%);
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
    background: rgba(255, 255, 255, 0.97);
    border: 2px solid #0050c8;              /* blue border */
    border-top: 6px solid #e0006b;          /* red accent strip */
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow:
      0 6px 18px rgba(0, 60, 160, 0.28),
      0 0 0 3px rgba(0, 220, 220, 0.35);    /* aqua glow */
    backdrop-filter: blur(2px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }
  .brand .logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #d100a0;              /* fuchsia ring */
    padding: 5px;
    box-shadow: 0 0 0 3px rgba(0, 220, 220, 0.5);
    flex-shrink: 0;
  }
  .brand .titles {
    min-width: 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
    color: #0a3a8c;                          /* deep blue title */
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  header .user {
    font-size: 0.78rem;
    color: #b0005a;                          /* red subtitle */
    font-weight: 600;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ---------- BUTTONS ---------- */
  .seed-btn,
  .logout-btn {
    padding: 8px 18px;
    color: white;
    border: 2px solid;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: 0.1s;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  .seed-btn {
    background: linear-gradient(90deg, #0050c8 0%, #d100a0 100%);
    border-color: #b0005a;
    box-shadow: 3px 3px 0 #7a003d;
  }
  .seed-btn:hover {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #7a003d;
    background: linear-gradient(90deg, #0063f0 0%, #e0008a 100%);
  }
  .logout-btn {
    background: linear-gradient(90deg, #d10020 0%, #e0006b 100%);
    border-color: #8b0018;
    box-shadow: 3px 3px 0 #5c000f;
  }
  .logout-btn:hover {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #5c000f;
    background: linear-gradient(90deg, #e00028 0%, #f0007a 100%);
  }

  /* ---------- CARD ---------- */
  .card {
    background: rgba(255, 255, 255, 0.97);
    border: 2px solid #0050c8;
    border-top: 6px solid #e0006b;
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow:
      0 10px 28px rgba(0, 60, 160, 0.28),
      0 0 0 3px rgba(0, 220, 220, 0.35);
    backdrop-filter: blur(2px);
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 1.15rem;
    color: #0a3a8c;
  }
  .card .hint {
    font-size: 0.82rem;
    color: #b0005a;
    font-weight: 600;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin: 16px 0 6px;
    color: #0050c8;                          /* blue labels */
    letter-spacing: 0.2px;
  }
  select, input {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid #0090c8;               /* blue input border */
    border-radius: 8px;
    font-size: 0.95rem;
    background: #f2fbff;                     /* faint aqua bg */
    color: #0d1b2a;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #d100a0;                   /* fuchsia on focus */
    background: white;
    box-shadow: 0 0 0 3px rgba(0, 220, 220, 0.45);   /* aqua glow */
  }
  select:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    background: #e0eef5;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
  }

  .actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 30px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.1s;
    border: 2px solid;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  .btn-primary {
    background: linear-gradient(90deg, #0050c8 0%, #d100a0 60%, #00c8c8 100%);
    color: white;
    border-color: #b0005a;
    box-shadow: 4px 4px 0 #7a003d;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #7a003d;
    background: linear-gradient(90deg, #0063f0 0%, #e0008a 60%, #00e0e0 100%);
  }
  .btn-secondary {
    background: linear-gradient(90deg, #00a0a0 0%, #0090c8 100%);
    color: white;
    border-color: #007a7a;
    box-shadow: 3px 3px 0 #004f4f;
  }
  .btn-secondary:hover {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #004f4f;
    background: linear-gradient(90deg, #00b8b8 0%, #00a8e0 100%);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* ---------- STATUS MESSAGES ---------- */
  .status {
    margin-top: 18px;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
  }
  .status.info    { display: block; background: #d6e9ff; color: #003a80; border: 1px solid #0050c8; }
  .status.error   { display: block; background: #ffd6e2; color: #b0003d; border: 1px solid #d100a0; }
  .status.success { display: block; background: #c9fbfb; color: #006565; border: 1px solid #00a0a0; }

  /* ---------- PREVIEW ---------- */
  .preview {
    margin-top: 18px;
    padding: 12px 16px;
    background: #0a1f33;                     /* deep blue-black */
    color: #7af0f0;                          /* aqua text */
    border: 1px solid #00a0a0;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    word-break: break-all;
    display: none;
  }
  .preview.show { display: block; }

  @media (max-width: 600px) {
    .brand .logo { width: 52px; height: 52px; }
    header h1 { font-size: 1.15rem; }
    header { padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <img class="logo" src="img/mainlogo.jpg" alt="Canaanland Model Schools Logo"
           onerror="this.style.display='none';">
      <div class="titles">
        <h1>🏫 Canaanland Model Schools Dashboard</h1>
        <div class="user" id="userInfo">—</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="seed-btn" id="ieBtn" style="background:linear-gradient(90deg,#0090c8,#00c8c8); border-color:#007a7a; box-shadow:3px 3px 0 #004f4f;">📥📤 Import/Export</button>
      <button class="seed-btn" id="seedBtn">🌱 Seed</button>
      <button class="logout-btn" id="logoutBtn">Logout</button>
      <button class="seed-btn" id="exportJsonBtn" style="background:linear-gradient(90deg,#6a2d8b,#d100a0); border-color:#5a0070; box-shadow:3px 3px 0 #3d004f;">📦 Export JSON</button>
    </div>
  </header>

  <div class="card">
    <h2>📄 Report Sheet Lookup</h2>
    <div class="hint">Select a session, class, and student to open or create their report sheet.</div>

    <label for="sessionSelect">Academic Session</label>
    <select id="sessionSelect">
      <option value="">— Select session —</option>
      <option value="2026-2027">2026 – 2027</option>
      <option value="2027-2028">2027 – 2028</option>
      <option value="2028-2029">2028 – 2029</option>
    </select>

    <div class="row">
      <div>
        <label for="classSelect">Class</label>
        <select id="classSelect" disabled>
          <option value="">— Select class —</option>
          <option value="JSS1">JSS 1</option>
          <option value="JSS2">JSS 2</option>
          <option value="JSS3">JSS 3</option>
          <option value="SS1">SS 1</option>
          <option value="SS2">SS 2</option>
          <option value="SS3">SS 3</option>
          <option value="SS4">SS 4</option>
        </select>
      </div>
      <div>
        <label for="studentSelect">Student Name</label>
        <select id="studentSelect" disabled>
          <option value="">— Select student —</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="nextBtn" disabled>Next →</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>

    <div class="status" id="status"></div>
    <div class="preview" id="preview"></div>
  </div>

</div>

<script>
/* ============================================================
   1. FIREBASE CONFIG (canaanland-records)
   ============================================================ */
const firebaseConfig = {
  apiKey:            "AIzaSyDK0XvZIxCTCD1R4PpB-HBxgncq0-VzIHw",
  authDomain:        "canaanland-records.firebaseapp.com",
  databaseURL:       "https://canaanland-records-default-rtdb.firebaseio.com",
  projectId:         "canaanland-records",
  storageBucket:     "canaanland-records.firebasestorage.app",
  messagingSenderId: "927332828173",
  appId:             "1:927332828173:web:5ece5527489877493c4144",
  measurementId:     "G-9013EP26HK"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ============================================================
   2. SESSION GUARD
   ============================================================ */
if (sessionStorage.getItem("wfs_logged_in") !== "true") {
  window.location.replace("login.html");
}

auth.onAuthStateChanged((user) => {
  if (!user) {
    sessionStorage.removeItem("wfs_logged_in");
    window.location.replace("login.html");
  } else {
    document.getElementById("userInfo").textContent = "Signed in as " + user.email;
  }
});

/* ============================================================
   3. USERS ARRAY — CANAANLAND STUDENTS BY CLASS
   ============================================================ */
const USERS = {
  "JSS1": [
    "afolabi darasmi",
    "ajiboye aduragbemi",

  "JSS2": [

    "adewunmi darasimi"
  ],
  "JSS3": [

    "olatise excel",

    "eyebiokin tobiloba",

    "ajiboye aanu",
    "akinola surprise"
  ],
  "SS1": [
    "abdullah kehinde",
    "abiodun paul",
    "aluko taiwo",
    "ojo emmanuel",
    "olajide daniel",

    "harris peace",

    "ajogo esther",

  ],
  "SS4": [

    "foluso boluwatito",
    "adejumo azeez",
    "ajayi sandra",
    "omole sefunmi",
    "ayebegan ayobami",
    "ojo success"
  ]
};

/* ============================================================
   4. DOM REFS
   ============================================================ */
const sessionSelect = document.getElementById("sessionSelect");
const classSelect   = document.getElementById("classSelect");
const studentSelect = document.getElementById("studentSelect");
const nextBtn       = document.getElementById("nextBtn");
const resetBtn      = document.getElementById("resetBtn");
const logoutBtn     = document.getElementById("logoutBtn");
const seedBtn       = document.getElementById("seedBtn");
const statusEl      = document.getElementById("status");
const previewEl     = document.getElementById("preview");
const ieBtn         = document.getElementById("ieBtn");

function setStatus(msg, type = "info") {
  statusEl.className = "status " + type;
  statusEl.textContent = msg;
}
function clearStatus() {
  statusEl.className = "status";
  statusEl.textContent = "";
}
function updatePreview() {
  const s = sessionSelect.value;
  const c = classSelect.value;
  const n = studentSelect.value;
  if (s && c && n) {
    const params = new URLSearchParams({ session: s, class: c, student: n });
    previewEl.textContent = "➡️ report.html?" + params.toString();
    previewEl.classList.add("show");
  } else {
    previewEl.classList.remove("show");
  }
}
function checkReady() {
  const ok = sessionSelect.value && classSelect.value && studentSelect.value;
  nextBtn.disabled = !ok;
  updatePreview();
}

/* ============================================================
   5. DROPDOWN LOGIC
   ============================================================ */
sessionSelect.addEventListener("change", () => {
  clearStatus();
  if (sessionSelect.value) {
    classSelect.disabled = false;
  } else {
    classSelect.disabled = true;
  }
  classSelect.value = "";
  studentSelect.innerHTML = '<option value="">— Select student —</option>';
  studentSelect.disabled = true;
  checkReady();
});

classSelect.addEventListener("change", () => {
  clearStatus();
  const cls = classSelect.value;
  studentSelect.innerHTML = '<option value="">— Select student —</option>';

  if (!cls) {
    studentSelect.disabled = true;
    checkReady();
    return;
  }

  const list = USERS[cls] || [];
  if (list.length === 0) {
    setStatus("⚠️ No students found for " + cls, "error");
    studentSelect.disabled = true;
    checkReady();
    return;
  }

  list.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    studentSelect.appendChild(opt);
  });
  studentSelect.disabled = false;
  checkReady();
});

studentSelect.addEventListener("change", checkReady);

/* ============================================================
   6. NEXT BUTTON → redirect to report.html
   ============================================================ */
nextBtn.addEventListener("click", () => {
  const session = sessionSelect.value;
  const cls     = classSelect.value;
  const student = studentSelect.value;

  if (!session || !cls || !student) {
    setStatus("⚠️ Please complete all selections.", "error");
    return;
  }

  const params = new URLSearchParams({
    session: session,
    class: cls,
    student: student
  });

  setStatus("✅ Opening report sheet…", "success");
  setTimeout(() => {
    window.location.href = "report.html?" + params.toString();
  }, 400);
});

/* ============================================================
   7. SEED BUTTON → redirect to seed.html
   ============================================================ */
seedBtn.addEventListener("click", () => {
  window.location.href = "seed.html";
});

/* ============================================================
   8. RESET
   ============================================================ */
resetBtn.addEventListener("click", () => {
  sessionSelect.value = "";
  classSelect.value = "";
  classSelect.disabled = true;
  studentSelect.innerHTML = '<option value="">— Select student —</option>';
  studentSelect.disabled = true;
  clearStatus();
  checkReady();
});

/* ============================================================
   9. IMPORT EXPORT BUTTON
   ============================================================ */
ieBtn.addEventListener("click", () => {
  window.location.href = "import-export.html";
});

/* ============================================================
   10. LOGOUT
   ============================================================ */
logoutBtn.addEventListener("click", async () => {
  if (!confirm("Log out of the portal?")) return;
  try {
    await auth.signOut();
  } catch (e) {
    console.warn("Sign-out error:", e);
  }
  sessionStorage.removeItem("wfs_logged_in");
  sessionStorage.removeItem("wfs_user_email");
  sessionStorage.removeItem("wfs_login_time");
  window.location.replace("login.html");
});

/* ============================================================
   11. EXPORT TO JSON
   ============================================================ */
document.getElementById("exportJsonBtn").addEventListener("click", () => {
  window.location.href = "export-json.html";
});

/* ============================================================
   12. INIT
   ============================================================ */
checkReady();
</script>
</body>
</html>
